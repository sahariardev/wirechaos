[workspace]
resolver = "2"
members = [
    "crates/wirechaos",
    "crates/wirechaos-core"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["sahariardev<rifatsahariar@gmail.com>"]
license = "MIT"
repository = "https://github.com/sahariardev/wirechaos"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "1.0"
bytes = "1.6"
tokio-rustls = "0.24"
rustls = "0.21"
rustls-pemfile = "2.0"